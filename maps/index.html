async function init() {
  if('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition((position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      console.log('Latitude: ' + lat + ', Longitiude: ' + lon);

      console.log(locations);

      map = L.map('map').setView([lat, lon], 11);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      locations.forEach(p => {
        let myIcon = L.icon({
          iconUrl: 'https://static.thenounproject.com/png/1661268-200.png',
          iconSize: [38, 38]
        });
        let marker = L.marker([p.lat, p.lng], {icon: myIcon}).addTo(map);
        marker.bindPopup(`<h2>${p.name}</h2><p>Name: ${p.name}<br/>Address: ${p.address}<br/>Website: ${p.website}<br/>Vicar: ${p.vicar}<br/><img src="${p.picture}" width="200"></p>`);
        marker.on('click', function() { this.openPopup(); });
      });
