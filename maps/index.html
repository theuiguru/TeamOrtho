<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TeamOrtho Church Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html, body {margin:0; padding:0;} #map {width:100vw; height:100vh;}</style></head><body>
<h1>TeamOrtho Church Finder</h1><p>A visual map guide for all local orthodox parishes in the Malankara Orthodox Syrian Church.</p>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
document.addEventListener('DOMContentLoaded', init, false);
let map;
let locations = [
  {"lat":30.216, "lng":-92.033, "name":"location 1"},
  {"lat":31.216, "lng":-91.033, "name":"location 2"},
  {"lat":29.216, "lng":-93.033, "name":"location 3"}
];
async function init() {
  if('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition((position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      console.log('Latitude: ' + lat + ', Longitiude: ' + lon);

      console.log(locations);

      map = L.map('map').setView([lat, lon], 9);

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      locations.forEach(p => {
        let marker = L.marker([p.lat, p.lng]).addTo(map);
        marker.bindPopup(`<h2>Location</h2><p>Name: ${p.name}</p>`);
        marker.on('click', function() { this.openPopup(); });
      });

      //let marker = L.marker([30.216, -92.033]).addTo(map);

      //marker.bindPopup("Meow").openPopup();
      //marker.bindPopup("Meow");

      //marker.on('click', openPopup);
      //map.on('click', onMapClick);
    });
  } else {
    console.log('Geolocation not available.');
  }
}
</script></body></html>
