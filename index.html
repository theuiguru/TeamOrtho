<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Team Ortho</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
dialog {border:none; box-shadow:0 0 10px #333; text-align:center; width:100%; max-width:800px; padding:100px;}
button {background:#292929; box-shadow:2px 2px 5px #000050 inset 2px 2px 5px #000050; border-radius:5px; border:none; padding:5px; text-shadow:0 0 5px #ff3399, 0 0 10px #ff3399, 0 0 15px #ff3399, 0 0 20px #ff3399;}
button:hover {text-shadow:0 0 5px #0099ff, 0 0 10px #0099ff, 0 0 15px #0099ff, 0 0 20px #0099ff;}
button:active {text-shadow:0 0 5px #6666ff, 0 0 10px #6666ff, 0 0 15px #6666ff, 0 0 20px #6666ff;}
</style></head><body>
<section class="text-white text-center bg-zinc-800 h-screen flex justify-center items-center">
  <div class="container">
    <button><i class="fas fa-3x fa-church"></i></button>
    <h1 class="text-3xl font-bold">Team Ortho</h1>
    <p class="text-lg mb-10">You Only Live Ortho!</p>
    <p class="flex flex-col justify-center items-center">
      <a href="./history" class="text-orange-400 hover:text-white border border-orange-400 hover:bg-orange-400 p-3 rounded block w-1/2 mb-3">History</a>
      <a href="./maps" class="text-green-400 hover:text-white border border-green-400 hover:bg-green-400 p-3 rounded block w-1/2 mb-3">Maps</a>
      <a href="./mgocsm" class="text-sky-400 hover:text-white border border-sky-400 hover:bg-sky-400 p-3 rounded block w-1/2 mb-3">MGOCSM</a>
      <a href="./orthodukso" class="text-red-400 hover:text-white border border-red-400 hover:bg-red-400 p-3 rounded block w-1/2 mb-3">Orthodukso</a>
      <a href="./shhimo" class="text-yellow-400 border border-yellow-400 hover:bg-yellow-300 hover:text-black p-3 rounded block w-1/2 mb-3">Sh'himo</a>
      <a href="/" class="text-purple-400 hover:text-white border border-purple-400 hover:bg-purple-400 p-3 rounded block w-1/2 faq">FAQ</a>
    </p>
    <dialog id="faq" class="border-none shadow-md w-full lg:w-1/2 mx-auto p-16"><details><summary>What is TeamOrtho?</summary><p>TeamOrtho is a one-stop shop for all things orthodoxy.</p><iframe width="560" height="315" src="https://www.youtube.com/embed/GGUPeEFBt9w" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen=""></iframe></details>
      <button onclick="dialog.close();" class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" class="text-2xl font-bold h-10 w-10" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M6.293 6.293a1 1 0 0 1 1.414 0L10 8.586l2.293-2.293a1 1 0 1 1 1.414 1.414L11.414 10l2.293 2.293a1 1 0 0 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 0-1.414z"/>
        </svg>
      </button>
    </dialog>
  </div>
</section><script>
const dialog = document.getElementById('faq');
const button = document.querySelector('.faq');
button.addEventListener('click', (e) => {
  e.preventDefault();
  dialog.showModal();
});
</script></body></html>
